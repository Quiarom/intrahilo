name: Proponer una mejora
description: Explica una necesidad concreta antes de proponer infraestructura.
title: "[Mejora]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema y usuario afectado
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Resultado observable y cómo comprobarlo
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: Alternativa más sencilla y límites
